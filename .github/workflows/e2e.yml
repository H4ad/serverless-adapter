name: e2e

on:
  workflow_dispatch:
    inputs:
      clouds:
        description: Comma-separated clouds to run
        default: aws,azure,do,gcp,firebase
      keep:
        description: Leave resources up for debugging
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    if: github.repository == 'H4ad/serverless-adapter' && (github.event_name == 'schedule' || contains(inputs.clouds, matrix.cloud))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure, do, gcp, firebase]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Install SAM CLI
        if: matrix.cloud == 'aws'
        run: |
          pipx install aws-sam-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Azure login
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install OpenTofu
        if: matrix.cloud == 'azure'
        uses: opentofu/setup-opentofu@v1

      - name: Install doctl
        if: matrix.cloud == 'do'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate to Google Cloud
        if: matrix.cloud == 'gcp' || matrix.cloud == 'firebase'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT }}

      - name: Install gcloud
        if: matrix.cloud == 'gcp' || matrix.cloud == 'firebase'
        uses: google-github-actions/setup-gcloud@v2

      - name: Install the Firebase CLI
        if: matrix.cloud == 'firebase'
        run: npm install --global firebase-tools

      - name: Run e2e
        run: npm run e2e:run -- --cloud ${{ matrix.cloud }}${{ inputs.keep && ' --keep' || '' }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'brazilsouth' }}
          DO_NAMESPACE: ${{ vars.DO_NAMESPACE }}
          DO_REGION: ${{ vars.DO_REGION || 'nyc1' }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          FIREBASE_PROJECT: ${{ vars.GCP_PROJECT }}
