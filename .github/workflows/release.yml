name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 4.4.1-hotfix.0, or 4.4.1 with stable enabled. Must not exist on npm."
        required: true
        type: string
      stable:
        description: "Publish a plain version instead of a prerelease, for a patch of an already released line"
        type: boolean
        default: false
      latest:
        description: "Point the latest dist-tag at it. Off, a stable patch publishes under release-<major>.<minor> and a hotfix under hotfix"
        type: boolean
        default: false
      dry_run:
        description: "Skip publish and tagging, just build and test"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PACKAGE: "@h4ad/serverless-adapter"

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release

      - name: Use Node 22.x
        uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Deps
        run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - name: Build
        run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - name: Test
        run: npm run test
        if: ${{ steps.release.outputs.release_created }}

      - name: Get Coverage Info
        if: ${{ steps.release.outputs.release_created }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # https://github.com/codecov/codecov-action/releases/tag/v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: NPM Publish
        run: npm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}

  hotfix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require a hotfix branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$REF" =~ ^refs/heads/hotfix/.+ ]]; then
            echo "::error::Hotfix releases must run from a hotfix/* branch cut off a release tag, got '${REF}'. Create one with: git checkout -b hotfix/4.4.1 v4.4.0"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Use Node 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # A prerelease is the safe default: a plain `4.4.1` satisfies `^4.4.0`, so it lands in
      # every consumer's next install, and dist-tags do not gate range resolution. Accepting
      # a plain version is only allowed with `stable`, which makes that outcome deliberate.
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
          STABLE: ${{ inputs.stable }}
          LATEST: ${{ inputs.latest }}
        run: |
          prerelease='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$'
          release='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$STABLE" != "true" && "$LATEST" == "true" ]]; then
            echo "::error::The latest input needs stable: moving latest onto a prerelease would make it everyone's default install"
            exit 1
          fi
          if [[ "$STABLE" == "true" ]]; then
            if [[ ! "$VERSION" =~ $release ]]; then
              echo "::error::Stable releases take a plain version like 4.4.1, got '${VERSION}'"
              exit 1
            fi
          elif [[ ! "$VERSION" =~ $prerelease ]]; then
            echo "::error::Version must be a prerelease semver (e.g. 4.4.1-hotfix.0). Enable the stable input to publish a plain version."
            exit 1
          fi

      # The branch is cut from a release tag, so package.json already carries the version that
      # line shipped. Publishing a version from another line would label this source as
      # something it is not, and 5.x from a 4.4 branch used to pass every other guard.
      - name: Check version matches the branch line
        env:
          VERSION: ${{ inputs.version }}
        run: |
          line=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          if [[ "$VERSION" != "${line}."* ]]; then
            echo "::error::${VERSION} is not a patch of ${line}, which package.json says this branch is. Cut the branch from the tag of the line you are patching."
            exit 1
          fi

      # Where the version lands. A patch of an old line must not take over `latest` from a newer
      # release, so it gets a dist-tag named after its own line: release-4.4 for 4.4.2.
      - name: Resolve npm dist-tag
        id: dist_tag
        env:
          VERSION: ${{ inputs.version }}
          STABLE: ${{ inputs.stable }}
          LATEST: ${{ inputs.latest }}
        run: |
          if [ "$STABLE" != "true" ]; then
            tag=hotfix
          elif [ "$LATEST" = "true" ]; then
            tag=latest
          else
            tag="release-$(echo "$VERSION" | cut -d. -f1,2)"
          fi
          echo "publishing ${VERSION} under the ${tag} dist-tag"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Compared against the ref name, not with grep: a version's dots are regex wildcards, so
      # `grep "refs/tags/v4.4.1$"` also matches an unrelated tag like v4x4x1. The listing is
      # captured first so a failure to reach the remote fails the step instead of skipping it.
      - name: Check tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! tags=$(git ls-remote --tags origin); then
            echo "::error::Could not list the remote tags, refusing to publish without the tag check"
            exit 1
          fi
          if printf '%s\n' "$tags" | awk -v want="refs/tags/v${VERSION}" '$2 == want { found = 1 } END { exit !found }'; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi

      # Publishing and creating the release are separate steps, so a failure between them leaves
      # the version on npm with no tag. Re-running has to be able to finish the job, but only for
      # the commit that was published: npm records it as gitHead, and tagging any other commit
      # would put the v-tag on source that differs from the tarball and its provenance. Any other
      # already-published version is still an error.
      #
      # npm view exits 1 both for a version or dist-tag that does not exist and for a registry it
      # could not reach. Only E404 means absent. Reading a network or auth error as "not
      # published" would let this check and the downgrade guard pass, so anything else fails.
      #
      # The dist-tag goes in as a package spec, not as a "dist-tags.<tag>" field path: npm splits
      # a field path on dots, so "dist-tags.release-4.4" resolves to nothing and the downgrade
      # guard would silently skip every release-X.Y line.
      - name: Check npm version and decide whether to publish
        id: npm_version
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.dist_tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          # Sets the variable named $1 to the field, or to empty when npm answers E404.
          npm_view() {
            local err="$RUNNER_TEMP/npm-view.err" out
            if out=$(npm view "$2" "$3" 2>"$err"); then
              printf -v "$1" '%s' "$out"
              return 0
            fi
            if grep -qE '^npm (error|ERR!) code E404$' "$err"; then
              printf -v "$1" '%s' ''
              return 0
            fi
            cat "$err"
            echo "::error::npm view $2 $3 failed for a reason other than not found, refusing to treat it as unpublished"
            exit 1
          }

          npm_view tag_version "${PACKAGE}@${TAG}" version
          npm_view published "${PACKAGE}@${VERSION}" version
          npm_view published_head "${PACKAGE}@${VERSION}" gitHead
          echo "tag_version=${tag_version}" >> "$GITHUB_OUTPUT"

          if [ -z "$published" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # The publish below points the dist-tag at this version.
            echo "on_dist_tag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$published_head" != "$SHA" ]; then
            echo "::error::${PACKAGE}@${VERSION} is already published from ${published_head:-a commit npm did not record}, and this run is at ${SHA}. Only a re-run of the commit that was published can finish its release."
            exit 1
          fi
          echo "::notice::${VERSION} is already published from ${SHA}, skipping the publish and continuing to the tag and release"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          # Another release may have moved the dist-tag since, and then this one must not claim it.
          if [ "$tag_version" = "$VERSION" ]; then
            echo "on_dist_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_dist_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Deps
        run: npm ci

      # A dist-tag is what a bare `npm i` resolves through, so publishing a version below the one
      # already on it would silently downgrade everyone following that tag. Compare against the
      # tag this run targets, not against latest, so a 4.4.2 can still ship after 5.0.0 is out.
      # A retry publishes nothing, so it cannot move the tag and skips the check: the tag may
      # have moved past this version since it was published.
      - name: Check version is newer than its dist-tag
        if: ${{ inputs.stable && steps.npm_version.outputs.skip != 'true' }}
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.dist_tag.outputs.tag }}
          CURRENT: ${{ steps.npm_version.outputs.tag_version }}
        run: |
          if [ -z "$CURRENT" ]; then
            echo "::notice::No ${TAG} dist-tag on npm yet, nothing to compare against"
            exit 0
          fi
          echo "current ${TAG}: ${CURRENT}"
          if ! node -e "process.exit(require('semver').gt(process.env.VERSION, process.env.CURRENT) ? 0 : 1)"; then
            echo "::error::${VERSION} is not greater than ${CURRENT}, which ${TAG} already points at. Publishing it there would downgrade everyone following that tag."
            exit 1
          fi

      # Also rewrites package-lock.json, so the lock stays in sync with the version.
      - name: Set package version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "${VERSION}" --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: NPM Publish
        if: ${{ !inputs.dry_run && steps.npm_version.outputs.skip != 'true' }}
        env:
          TAG: ${{ steps.dist_tag.outputs.tag }}
        run: npm publish --provenance --access public --tag "${TAG}"

      - name: Create tag and GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
          STABLE: ${{ inputs.stable }}
          TAG: ${{ steps.dist_tag.outputs.tag }}
          ON_DIST_TAG: ${{ steps.npm_version.outputs.on_dist_tag }}
        run: |
          if [ "$STABLE" = "true" ]; then
            kind="Patch release"
            prerelease=""
          else
            kind="Hotfix"
            prerelease="--prerelease"
          fi

          # The flag is always explicit. Without it, GitHub picks its own Latest release by date
          # and version, which can disagree with npm in both directions: an old-line patch
          # published today can take it over from a newer release, and a new latest may not get
          # it. GitHub's Latest follows npm's: it moves only when npm latest points at this version.
          if [ "$TAG" = "latest" ] && [ "$ON_DIST_TAG" = "true" ]; then
            latest_flag="--latest"
          else
            latest_flag="--latest=false"
          fi

          gh release create "v${VERSION}" \
            --target "$SHA" \
            --title "v${VERSION}" \
            --notes "${kind} published from \`${BRANCH}\`, npm dist-tag \`${TAG}\`." \
            ${prerelease} ${latest_flag}
